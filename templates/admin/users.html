{% extends 'base.html' %}{% block title %}Manage Users{% endblock %}{% block content %}<div class="container page-header"><span class="eyebrow">ADMIN</span><h1>Manage Users</h1></div><div class="container content-card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Location</th><th>Blood</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.mobile }}</td><td>{{ u.city }} / {{ u.area }}</td><td>{{ u.blood_group }}</td><td><span class="badge">{{ u.role }}</span></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
