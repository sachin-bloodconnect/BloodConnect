{% extends 'base.html' %}{% block title %}Edit Donor Profile{% endblock %}{% block content %}<div class="container page-header"><h1>Edit Donor Profile</h1></div><div class="container content-card narrow"><form method="post"><label>Full Name</label><input name="full_name" value="{{ user.full_name }}" required><label>Blood Group</label><select name="blood_group">{% for g in blood_groups %}<option {% if g==user.blood_group %}selected{% endif %}>{{ g }}</option>{% endfor %}</select><label>City</label><input name="city" value="{{ user.city }}" required><label>Area</label><input name="area" value="{{ user.area }}" required><button class="btn btn-primary">Save</button></form></div>{% endblock %}
