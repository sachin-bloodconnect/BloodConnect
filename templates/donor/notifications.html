{% extends 'base.html' %}{% block title %}Donor Notifications{% endblock %}{% block content %}<div class="container page-header"><span class="eyebrow">DONOR ACCOUNT</span><h1>Notifications</h1></div><div class="container content-card">{% for n in notifications %}<div class="notification {% if not n.is_read %}unread{% endif %}"><div><strong>{{ n.title }}</strong><p>{{ n.message }}</p><small>{{ n.created_at }}</small></div>{% if not n.is_read %}<form method="post" action="{{ url_for('mark_notification',notification_id=n.id) }}"><button class="btn btn-small btn-light">Mark read</button></form>{% endif %}</div>{% else %}<div class="empty">No notifications.</div>{% endfor %}</div>{% endblock %}
