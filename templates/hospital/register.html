{% extends 'base.html' %}{% block title %}Hospital Registration{% endblock %}{% block content %}<div class="auth-shell"><div class="auth-card wide"><span class="eyebrow">PARTICIPATING HOSPITAL</span><h1>Hospital Registration</h1><form method="post" class="form-grid"><div><label>Hospital Name *</label><input name="hospital_name" required></div><div><label>Registration Number *</label><input name="registration_no" required></div><div><label>Contact Person *</label><input name="contact_person" required></div><div><label>Email *</label><input type="email" name="email" required></div><div><label>Mobile *</label><input name="mobile" pattern="[6-9][0-9]{9}" required></div><div><label>Password *</label><input type="password" name="password" minlength="6" required></div><div><label>Blood Group (profile) *</label><select name="blood_group">{% for g in blood_groups %}<option>{{ g }}</option>{% endfor %}</select></div><div><label>City *</label><input name="city" required></div><div><label>Area *</label><input name="area" required></div><div><label>Pincode</label><input name="pincode" pattern="[0-9]{6}"></div><div class="full"><label>Address *</label><textarea name="address" rows="3" required></textarea></div><div class="full"><button class="btn btn-primary">Register Hospital</button></div></form></div></div>{% endblock %}
