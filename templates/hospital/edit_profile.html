{% extends 'base.html' %}{% block title %}Edit Hospital Profile{% endblock %}{% block content %}<div class="container page-header"><h1>Edit Hospital Profile</h1></div><div class="container content-card narrow"><form method="post"><label>Hospital Name</label><input name="hospital_name" value="{{ hospital.hospital_name }}" required><label>Address</label><textarea name="address" rows="3" required>{{ hospital.address }}</textarea><label>Pincode</label><input name="pincode" value="{{ hospital.pincode or '' }}"><label>City</label><input name="city" value="{{ hospital.city }}" required><label>Area</label><input name="area" value="{{ hospital.area }}" required><button class="btn btn-primary">Save</button></form></div>{% endblock %}
