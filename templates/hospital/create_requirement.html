{% extends 'base.html' %}{% block title %}Create Requirement{% endblock %}{% block content %}<div class="container page-header"><span class="eyebrow">HOSPITAL DEMAND</span><h1>Create Blood Requirement</h1></div><div class="container content-card narrow"><form method="post"><label>Blood Group</label><select name="blood_group">{% for g in blood_groups %}<option>{{ g }}</option>{% endfor %}</select><label>Required Quantity</label><input type="number" name="quantity" min="1" required><label>Required Date</label><input type="date" name="required_date" required><label>Priority</label><select name="priority"><option>Normal</option><option>Urgent</option><option>Critical</option></select><label>Notes</label><textarea name="notes" rows="4"></textarea><button class="btn btn-primary">Create Requirement</button></form></div>{% endblock %}
