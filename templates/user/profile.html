{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<div class="container page-header"><span class="eyebrow">PROFILE</span><h1>My Profile</h1></div><div class="container content-card"><form method="post" class="form-grid"><div><label>Full Name</label><input name="full_name" value="{{ user.full_name }}" required></div><div><label>Email</label><input value="{{ user.email }}" disabled></div><div><label>Mobile</label><input value="{{ user.mobile }}" disabled></div><div><label>Blood Group</label><select name="blood_group">{% for g in blood_groups %}<option {% if g==user.blood_group %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div><div><label>City</label><input name="city" value="{{ user.city }}" required></div><div><label>Area</label><input name="area" value="{{ user.area }}" required></div><div class="full"><button class="btn btn-primary">Save Profile</button></div></form></div>{% endblock %}
