{% extends 'base.html' %}

{% block title %}Create Blood Request{% endblock %}

{% block content %}

<div class="container page-header">

    <span class="eyebrow">BLOODCONNECT</span>

    <h1>Request Blood</h1>

    <p>
        Submit a blood request and BloodConnect will help identify
        suitable registered donors.
    </p>

</div>

<div class="container">

    <div class="content-card">

        <form method="POST">

            <div class="form-grid">

                <div>
                    <label>Blood Group *</label>

                    <select name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div>
                    <label>Required Quantity (Units) *</label>

                    <input
                        type="number"
                        name="required_quantity"
                        min="1"
                        max="20"
                        required
                    >
                </div>

                <div>
                    <label>Required Date *</label>

                    <input
                        type="date"
                        name="required_date"
                        required
                    >
                </div>

                <div>
                    <label>City *</label>

                    <input
                        type="text"
                        name="city"
                        placeholder="e.g. Pune"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label>Area *</label>

                    <input
                        type="text"
                        name="area"
                        placeholder="e.g. Hadapsar"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label>Priority *</label>

                    <select name="priority" required>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Urgent">
                            Urgent
                        </option>

                        <option value="Critical">
                            Critical
                        </option>

                    </select>
                </div>

            </div>

            <div>
                <label>Additional Notes</label>

                <textarea
                    name="notes"
                    rows="5"
                    placeholder="Hospital name, patient information or other important details..."
                ></textarea>
            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Blood Request
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
